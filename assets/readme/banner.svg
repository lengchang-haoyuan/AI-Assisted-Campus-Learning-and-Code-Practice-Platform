<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">ScholarHub · AI 辅助校园学习与代码实践平台</title>
  <desc id="desc">以项目实践为起点，借助 AI 分析与练习，通过版本提交和教学反馈继续改进。森林绿与纸白配色与 Campus Studio 界面一致。</desc>
